name: Multi-platform UI Loader
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, android-arm, linux-x64, linux-x86, windows-x64, windows-x86]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: |
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Android NDK r27c
        if: startsWith(matrix.target, 'android')
        run: |
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Install 32-bit Linux compiler
        if: matrix.target == 'linux-x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Install Windows cross compiler
        if: startsWith(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64
      - name: Compile
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash tools/build_ui_ci.sh "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            build/ci/libloader.*.so
            build/ci/libloader.*.dll
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: build/package
      - name: Package all six platforms
        run: |
          mkdir -p dist
          cc -shared -fPIC -O2 -DIS_TEFKERNEL_BUILD=1 -I tools/package-codec/include tools/package-codec/src/*.c -o build/libtefpkg-host.so
          python3 tools/tefpkg_tool.py --kernel-lib "$PWD/build/libtefpkg-host.so" build build/package dist/lualoader.tefpkg 0x114514
          python3 tools/make_ui_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LuaLoader-All-Platforms-UI
          path: dist/LuaLoader-*.zip
          if-no-files-found: error
